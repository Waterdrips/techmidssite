name: Update agenda

# Rebuilds agenda.json from the conf.techmids.org source and commits it when it changes.
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "package*.json", ".github/workflows/update-agenda.yml"]

permissions:
  contents: write

concurrency:
  group: update-agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: techmids/conf.techmids.org
          path: .conf-src
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit if the agenda changed
        run: |
          git add agenda.json sw.js img
          if git diff --cached --quiet; then
            echo "Agenda unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update agenda from conf.techmids.org"
          git push
