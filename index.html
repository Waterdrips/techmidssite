const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };

// Current date and minute-of-day in Europe/London, whatever the phone's own timezone.
function londonNow(){
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
      .formatToParts(new Date()).map(x => [x.type, x.value]));
    return {ymd:`${p.year}-${p.month}-${p.day}`, min:Number(p.hour)*60+Number(p.minute)};
  } catch(e) {
    const d = new Date();
    return {ymd:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`, min:d.getHours()*60+d.getMinutes()};
  }
}
// Last screen you were (or will be) in before item i, for room-change hints.
function prevScreen(i){ for (let j=i-1;j>=0;j--) if (items[j].s) return items[j].s; return null; }
function until(m){ const h = Math.floor(m/60), r = m%60; return m<=0 ? "now" : h ? `in ${h}h ${r}m` : `in ${r} min`; }

function liveRow(kind, label, it, i, sub){
  let room = "";
  if (it && it.s) {
    const prev = prevScreen(i);
    room = prev && prev !== it.s ? `<span class="room">Room change: ${esc(prev)} → ${esc(it.s)}</span>`
         : prev ? `<span class="room stay">Same room: ${esc(it.s)}</span>` : `<span class="room stay">${esc(it.s)}</span>`;
  }
  return `<div class="live-row ${kind}"><span class="tag">${label}</span><div>`+
    `<div class="live-title">${esc(it ? it.title : "")}</div>`+
    `<div class="live-sub">${sub}</div>${kind==="next"?room:""}</div></div>`;
}

function render(){
  const {ymd, min:cur} = londonNow();
  const today = ymd === DAY;
  let nowIdx = -1, nextIdx = -1;
  if (today) {
    items.forEach((it,i) => { if (!it.end && cur >= mins(it.t) && cur < mins(items[i+1].t)) nowIdx = i; });
    nextIdx = items.findIndex(it => mins(it.t) > cur);
  }
  // Itinerary list
  document.getElementById("agenda").innerHTML = items.map((it,i) => {
    const ended = today && (it.end ? cur >= mins(it.t) : cur >= mins(items[i+1].t));
    const cls = [it.gap?"gap":"", ended?"past":"", i===nowIdx?"now":"", i===nextIdx?"next":""].filter(Boolean).join(" ");
    return `<li class="${cls}"><span class="t">${it.t}</span><div>`+
      (it.s?`<span class="screen">${esc(it.s)}</span>`:"")+
      `<div class="title">${esc(it.title)}</div>`+
      (it.who?`<div class="who">${esc(it.who)}</div>`:"")+
      (it.alt?`<div class="alt">${esc(it.alt)}</div>`:"")+`</div></li>`;
  }).join("");
  // Live banner
  const live = document.getElementById("live");
  let html = "";
  if (ymd < DAY) {
    const days = Math.round((Date.parse(DAY) - Date.parse(ymd)) / 864e5);
    html = liveRow("next", days===1?"TMRW":"SOON", items[0], 0, `Fri 27 Nov, doors 08:30 · ${days===1?"tomorrow":`in ${days} days`}`) +
           liveRow("next", "1ST", items[1], 1, `09:45 · ${esc(items[1].s)} · ${esc(items[1].who)}`);
  } else if (ymd > DAY || (today && cur >= mins("17:15"))) {
    html = `<div class="live-row"><span class="tag">DONE</span><div><div class="live-title">That's a wrap for TechMids Conf 2026</div><div class="live-sub">Thanks for coming. Full agenda below.</div></div></div>`;
  } else {
    if (nowIdx >= 0) {
      const it = items[nowIdx], endsAt = items[nowIdx+1].t;
      html += liveRow("now", "NOW", it, nowIdx, `${it.t}–${endsAt}${it.s?` · ${esc(it.s)}`:""}${it.who&&!it.gap?` · ${esc(it.who)}`:""}`);
    } else {
      html += `<div class="live-row now"><span class="tag">NOW</span><div><div class="live-title">Before doors</div><div class="live-sub">Doors open 08:30</div></div></div>`;
    }
    if (nextIdx >= 0 && !items[nextIdx].end) {
      const it = items[nextIdx];
      html += liveRow("next", "NEXT", it, nextIdx, `${it.t} · ${until(mins(it.t)-cur)}${it.who&&!it.gap?` · ${esc(it.who)}`:""}`);
    } else if (nextIdx >= 0) {
      html += `<div class="live-row next"><span class="tag">NEXT</span><div><div class="live-title">Close</div><div class="live-sub">17:15 · ${until(mins("17:15")-cur)}</div></div></div>`;
    }
  }
  live.innerHTML = html;
}
render();
setInterval(render, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

// QR overlay (QR is pre-rendered inline, so it works offline)
const overlay = document.getElementById("overlay"), btn = document.getElementById("qrBtn");
let lock = null;
async function openQR(){
  overlay.hidden = false; overlay.focus();
  try { if (overlay.requestFullscreen) await overlay.requestFullscreen(); } catch(e) {}
  try { if (navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); } catch(e) {}
}
function closeQR(){
  overlay.hidden = true; btn.focus();
  try { if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); } catch(e) {}
  try { lock && lock.release(); } catch(e) {} lock = null;
}
btn.addEventListener("click", openQR);
overlay.addEventListener("click", closeQR);
document.addEventListener("keydown", e => { if (!overlay.hidden && (e.key === "Escape" || e.key === "Enter" || e.key === " ")) { e.preventDefault(); closeQR(); } });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && !overlay.hidden) overlay.hidden = true; });
</script>
