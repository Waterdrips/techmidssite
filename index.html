<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechMids Conf talk picker</title>
<meta name="description" content="Pick one talk per slot at TechMids Conf 2026 and get your own itinerary for the day. Works offline.">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* One narrow column: live NOW/NEXT banner, a Pick / My day switch, then the agenda. No CDN, fonts or third-party calls. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#14202b; --muted:#5b6b78; --line:#d9e0e6;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e3eef6; --now:#c98a00; --now-bg:#fff6df; --warn:#b3261e; --warn-bg:#fde8e6;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e151c; --surface:#16212b; --fg:#e8eef3; --muted:#93a4b2; --line:#26343f;
  --accent:#5fa8d8; --accent-ink:#0b1218; --accent-soft:#17303f; --now:#f2b632; --now-bg:#2a2410; --warn:#ff8a80; --warn-bg:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151c; --surface:#16212b; --fg:#e8eef3; --muted:#93a4b2; --line:#26343f;
  --accent:#5fa8d8; --accent-ink:#0b1218; --accent-soft:#17303f; --now:#f2b632; --now-bg:#2a2410; --warn:#ff8a80; --warn-bg:#3a1714; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.45;margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:600px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:2rem;line-height:1.1;font-weight:800;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:.95rem}
.meta a{color:inherit}

/* Notices */
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:8px}
.notice.warn{border-color:var(--warn);background:var(--warn-bg)}
.notice .row{display:flex;gap:8px;flex-wrap:wrap}

/* Live banner */
.live{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.live-row{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 14px;align-items:start}
.live-row>div{min-width:0}
.live-row+.live-row{border-top:1px solid var(--line)}
.live-row.now{background:var(--now-bg);box-shadow:inset 4px 0 0 var(--now)}
.tag{font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.08em;padding-top:3px}
.now .tag{color:var(--now)}
.next .tag{color:var(--accent)}
.live-title{font-weight:700;line-height:1.3}
.live-sub{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.room{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;
  color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn)}
.room.stay{color:var(--muted);background:transparent;border-color:var(--line)}

/* View switch */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:-8px 0}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.switch button{appearance:none;border:0;background:transparent;border-radius:9px;padding:10px 8px;font-weight:700;cursor:pointer}
.switch button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.switch button:focus-visible{outline:3px solid var(--now);outline-offset:2px}
.count{font-family:var(--mono);font-size:.75rem;opacity:.85;margin-left:4px}

/* Slots */
.slot{display:flex;flex-direction:column;gap:8px}
.slot-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.slot-time{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.slot-state{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.slot-state.done{color:var(--accent)}
.slot.now .slot-time::after{content:" · NOW";color:var(--now)}
.slot.past{opacity:.55}
.fixed{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:.92rem}
.fixed .slot-time{color:var(--fg)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.picked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 0 no-repeat,var(--surface)}
.pick{appearance:none;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;
  display:grid;grid-template-columns:48px 1fr 28px;gap:12px;padding:12px 12px 10px;align-items:start}
.pick:focus-visible{outline:3px solid var(--now);outline-offset:-3px;border-radius:14px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;
  font-weight:800;color:var(--accent);font-size:1rem;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pick>div{min-width:0}
.screen{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.04em;
  padding:2px 7px;border-radius:5px;border:1px solid var(--accent);color:var(--accent);margin-bottom:4px}
.title{font-weight:650;font-size:1.02rem;line-height:1.3;overflow-wrap:anywhere}
.who{color:var(--muted);font-size:.88rem}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:2px}
.picked .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{width:15px;height:15px;opacity:0}
.picked .tick svg{opacity:1}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:8px 12px 8px 72px;font-size:.85rem;color:var(--accent);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";display:inline-block;width:1em}
details[open] summary::before{content:"▾ "}
.abstract{padding:0 14px 12px 72px;font-size:.92rem}
.abstract p{margin:0 0 .6em}
@media (max-width:380px){summary,.abstract{padding-left:14px}}

/* My day */
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li.it{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:14px 10px;border-bottom:1px solid var(--line);border-radius:10px}
li.it>div{min-width:0}
.t{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem;padding-top:2px}
li.gap .title{font-weight:400;color:var(--muted)}
li.empty .title{font-weight:400;color:var(--muted);font-style:italic}
li.past{opacity:.45}
li.now{background:var(--now-bg);border-bottom-color:transparent;box-shadow:inset 4px 0 0 var(--now)}
li.now .t::after{content:"NOW";display:block;font-size:.65rem;color:var(--now);margin-top:4px;letter-spacing:.08em}
li.next .t::after{content:"NEXT";display:block;font-size:.65rem;color:var(--accent);margin-top:4px;letter-spacing:.08em}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.mv{font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--warn);margin-top:4px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--now);outline-offset:2px}
footer{font-size:.82rem;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:4px}
footer a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100vw - 32px);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow">TechMids Conf 2026 · Birmingham</span>
    <h1>Pick your talks</h1>
    <div class="meta" id="meta">Fri 27 Nov 2026 · Everyman Cinema, The Mailbox</div>
  </header>

  <div id="notices"></div>
  <div class="live" id="live" aria-live="polite" hidden></div>

  <div class="bar">
    <div class="switch" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tabPick" aria-controls="viewPick" aria-selected="true">Pick talks</button>
      <button type="button" role="tab" id="tabDay" aria-controls="viewDay" aria-selected="false">My day<span class="count" id="count"></span></button>
    </div>
  </div>

  <section id="viewPick" role="tabpanel" aria-labelledby="tabPick">
    <div id="slots"><p class="meta">Loading the agenda…</p></div>
  </section>

  <section id="viewDay" role="tabpanel" aria-labelledby="tabDay" hidden>
    <ol id="day"></ol>
    <div class="actions" style="margin-top:16px">
      <button class="btn primary" type="button" id="shareBtn">Share my picks</button>
      <button class="btn" type="button" id="clearBtn">Clear picks</button>
    </div>
  </section>

  <footer>
    <span>Your picks are saved on this device only. Nothing is sent anywhere.</span>
    <span>Agenda from <a href="https://conf.techmids.org" target="_blank" rel="noopener">conf.techmids.org</a><span id="updated"></span></span>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const KEY_PICKS = "tmconf:picks:v1";   // { [slotId]: talkId } plus a talk->slot memory for spotting moves
const KEY_AGENDA = "tmconf:agenda:v1"; // last good agenda.json, for offline use
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
  del(k){ try { localStorage.removeItem(k); } catch(e) {} },
};

let A = null;                                   // agenda
let picks = store.get(KEY_PICKS) || {talks:{}}; // talks: { talkId: slotIdWhenPicked }
if (!picks.talks) picks = {talks:{}};
let view = "pick";
const openDetails = new Set(); // keeps "About this talk" open across re-renders

// ---------- Data ----------
const talkIndex = () => { const m = new Map(); for (const s of A.slots) for (const t of (s.talks||[])) m.set(t.id, {slot:s, talk:t}); return m; };
function pickFor(slot){
  for (const t of slot.talks||[]) if (picks.talks[t.id]) return t;
  return null;
}
const isComplete = () => A.slots.filter(s => s.kind === "talks").every(pickFor);
function savePicks(){ store.set(KEY_PICKS, picks); }
function setPick(slot, talk){
  for (const t of slot.talks) delete picks.talks[t.id];
  if (talk) picks.talks[talk.id] = slot.id;
  savePicks();
}
// Picks whose talk vanished from the agenda, or whose talk moved to another time.
function pickProblems(){
  const idx = talkIndex(), gone = [], moved = [];
  for (const [id, slotId] of Object.entries(picks.talks)) {
    const hit = idx.get(id);
    if (!hit) gone.push(slotId);
    else if (hit.slot.id !== slotId) moved.push(hit);
  }
  return {gone, moved};
}
const speakerLine = t => t.speakers.length
  ? t.speakers.map(k => A.speakers[k]).map(s => s.role ? `${s.name} · ${s.role}` : s.name).join(", ")
  : t.by;
const speakerName = t => t.speakers.length ? t.speakers.map(k => A.speakers[k].name).join(" & ") : t.by;
const initials = n => String(n).split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join("").toUpperCase();

// ---------- Time ----------
function londonNow(){
  try {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
      .formatToParts(new Date()).map(x => [x.type, x.value]));
    return {ymd:`${p.year}-${p.month}-${p.day}`, min:Number(p.hour)*60+Number(p.minute)};
  } catch(e) {
    const d = new Date();
    return {ymd:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`, min:d.getHours()*60+d.getMinutes()};
  }
}
function until(m){ const h = Math.floor(m/60), r = m%60; return m<=0 ? "now" : h ? `in ${h}h ${r}m` : `in ${r} min`; }

// ---------- Itinerary (what "My day" and the banner use) ----------
function itinerary(){
  return A.slots.map(s => {
    if (s.kind === "fixed") return {slot:s, t:s.start, end:s.end, title:s.title, sub:s.note, gap:true};
    const p = pickFor(s);
    return p ? {slot:s, t:s.start, end:s.end, title:p.title, sub:speakerName(p), room:p.room, talk:p}
             : {slot:s, t:s.start, end:s.end, title:"No talk picked", empty:true};
  });
}
function prevRoom(items, i){ for (let j=i-1;j>=0;j--) if (items[j].room) return items[j].room; return null; }
function roomHint(items, i){
  const it = items[i]; if (!it.room) return "";
  const prev = prevRoom(items, i);
  return prev && prev !== it.room ? `<span class="room">Room change: ${esc(prev)} → ${esc(it.room)}</span>`
       : prev ? `<span class="room stay">Same room: ${esc(it.room)}</span>` : `<span class="room stay">${esc(it.room)}</span>`;
}

// ---------- Render ----------
function render(){
  if (!A) return;
  const {ymd, min:cur} = londonNow();
  const today = ymd === A.event.date;
  const items = itinerary();
  const talkSlots = A.slots.filter(s => s.kind === "talks");
  const done = talkSlots.filter(pickFor).length;
  $("count").textContent = ` ${done}/${talkSlots.length}`;

  // Notices: shared picks link, and picks that no longer match the agenda.
  let notes = "";
  if (incoming) {
    notes += `<div class="notice"><div>Someone shared their picks with you (${incoming.length} talk${incoming.length===1?"":"s"}).</div>
      <div class="row"><button class="btn primary" type="button" data-act="import">Use these picks</button><button class="btn" type="button" data-act="dismiss">No thanks</button></div></div>`;
  }
  const {gone, moved} = pickProblems();
  if (gone.length || moved.length) {
    const lines = [];
    if (gone.length) lines.push(`Your ${gone.map(g => esc(String(g).split("-")[0])).join(", ")} pick${gone.length===1?" is":"s are"} no longer on the agenda. Pick another talk for ${gone.length===1?"that slot":"those slots"}.`);
    for (const m of moved) lines.push(`“${esc(m.talk.title)}” has moved to ${esc(m.slot.start)} in ${esc(m.talk.room)}.`);
    notes += `<div class="notice warn"><div>${lines.join("<br>")}</div><div class="row"><button class="btn" type="button" data-act="ack">Got it</button></div></div>`;
  }
  $("notices").innerHTML = notes;

  // Pick view
  $("slots").innerHTML = A.slots.map(s => {
    const past = today && cur >= mins(s.end), now = today && cur >= mins(s.start) && cur < mins(s.end);
    const cls = ["slot", past?"past":"", now?"now":""].filter(Boolean).join(" ");
    if (s.kind === "fixed") {
      return `<div class="${cls}" id="s-${esc(s.id)}"><div class="fixed"><span class="slot-time">${esc(s.start)}</span><div><strong>${esc(s.title)}</strong>${s.note?` · ${esc(s.note)}`:""}</div></div></div>`;
    }
    const p = pickFor(s);
    return `<div class="${cls}" id="s-${esc(s.id)}">
      <div class="slot-head"><span class="slot-time">${esc(s.start)}–${esc(s.end)}</span><span class="slot-state ${p?"done":""}">${p?`Picked · ${esc(p.room)}`:"Pick one"}</span></div>
      <div class="cards">${s.talks.map(t => {
        const on = p && p.id === t.id;
        const sp = t.speakers[0] && A.speakers[t.speakers[0]];
        const av = sp && sp.img ? `<img src="${esc(sp.img)}" alt="" loading="lazy" width="48" height="48">` : esc(initials(speakerName(t)));
        return `<div class="card${on?" picked":""}">
          <button class="pick" type="button" aria-pressed="${on}" data-slot="${esc(s.id)}" data-talk="${esc(t.id)}">
            <span class="avatar" aria-hidden="true">${av}</span>
            <div><span class="screen">${esc(t.room)}</span><div class="title">${esc(t.title)}</div><div class="who">${esc(speakerLine(t))}</div></div>
            <span class="tick" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>
          </button>
          ${t.abstract.length || t.url ? `<details data-talk="${esc(t.id)}"${openDetails.has(t.id)?" open":""}><summary>About this talk</summary><div class="abstract">${t.abstract.map(x => `<p>${esc(x)}</p>`).join("")}${t.url?`<p><a href="${esc(t.url)}" target="_blank" rel="noopener">Speaker page on conf.techmids.org</a></p>`:""}</div></details>` : ""}
        </div>`;
      }).join("")}</div></div>`;
  }).join("");

  // My day view
  let nowIdx = -1, nextIdx = -1;
  if (today) {
    items.forEach((it,i) => { if (cur >= mins(it.t) && cur < mins(it.end)) nowIdx = i; });
    nextIdx = items.findIndex(it => mins(it.t) > cur);
  }
  $("day").innerHTML = items.map((it,i) => {
    const ended = today && cur >= mins(it.end);
    const cls = ["it", it.gap?"gap":"", it.empty?"empty":"", ended?"past":"", i===nowIdx?"now":"", i===nextIdx?"next":""].filter(Boolean).join(" ");
    const prev = prevRoom(items, i);
    return `<li class="${cls}"><span class="t">${esc(it.t)}</span><div>`+
      (it.room?`<span class="screen">${esc(it.room)}</span>`:"")+
      `<div class="title">${esc(it.title)}</div>`+
      (it.empty?`<button class="linkbtn" type="button" data-goto="${esc(it.slot.id)}">Pick a talk for ${esc(it.t)}</button>`:"")+
      (it.sub?`<div class="who">${esc(it.sub)}</div>`:"")+
      (it.room && prev && prev !== it.room ? `<div class="mv">Move from ${esc(prev)}</div>` : "")+
      `</div></li>`;
  }).join("") + `<li class="it gap${today && cur>=mins(A.event.end)?" past":""}"><span class="t">${esc(A.event.end)}</span><div><div class="title">Close</div></div></li>`;

  // Live banner (only from the day before onwards, and once the person has a plan or it is the day)
  const live = $("live");
  let html = "";
  const firstTalk = items.findIndex(it => it.talk);
  if (ymd < A.event.date) {
    const days = Math.round((Date.parse(A.event.date) - Date.parse(ymd)) / 864e5);
    html = `<div class="live-row next"><span class="tag">${days===1?"TMRW":"SOON"}</span><div><div class="live-title">${esc(A.event.title)}</div><div class="live-sub">Doors ${esc(A.event.start)} · ${days===1?"tomorrow":`in ${days} days`} · ${done}/${talkSlots.length} slots picked</div></div></div>`;
    if (firstTalk >= 0) { const it = items[firstTalk]; html += `<div class="live-row next"><span class="tag">1ST</span><div><div class="live-title">${esc(it.title)}</div><div class="live-sub">${esc(it.t)} · ${esc(it.room)} · ${esc(it.sub)}</div></div></div>`; }
  } else if (ymd > A.event.date || (today && cur >= mins(A.event.end))) {
    html = `<div class="live-row"><span class="tag">DONE</span><div><div class="live-title">That's a wrap for ${esc(A.event.title)}</div><div class="live-sub">Thanks for coming.</div></div></div>`;
  } else {
    if (nowIdx >= 0) {
      const it = items[nowIdx];
      html += `<div class="live-row now"><span class="tag">NOW</span><div><div class="live-title">${esc(it.title)}</div><div class="live-sub">${esc(it.t)}–${esc(it.end)}${it.room?` · ${esc(it.room)}`:""}${it.talk?` · ${esc(it.sub)}`:""}</div></div></div>`;
    } else {
      html += `<div class="live-row now"><span class="tag">NOW</span><div><div class="live-title">Before doors</div><div class="live-sub">Doors open ${esc(A.event.start)}</div></div></div>`;
    }
    if (nextIdx >= 0) {
      const it = items[nextIdx];
      html += `<div class="live-row next"><span class="tag">NEXT</span><div><div class="live-title">${esc(it.title)}</div><div class="live-sub">${esc(it.t)} · ${until(mins(it.t)-cur)}${it.talk?` · ${esc(it.sub)}`:""}</div>${roomHint(items, nextIdx)}</div></div>`;
    } else {
      html += `<div class="live-row next"><span class="tag">NEXT</span><div><div class="live-title">Close</div><div class="live-sub">${esc(A.event.end)} · ${until(mins(A.event.end)-cur)}</div></div></div>`;
    }
  }
  live.innerHTML = html;
  live.hidden = !html;
}

// ---------- Interaction ----------
function show(v){
  view = v;
  $("tabPick").setAttribute("aria-selected", v === "pick");
  $("tabDay").setAttribute("aria-selected", v === "day");
  $("viewPick").hidden = v !== "pick";
  $("viewDay").hidden = v !== "day";
  try { sessionStorage.setItem("tmconf:view", v); } catch(e) {}
}
$("tabPick").addEventListener("click", () => show("pick"));
$("tabDay").addEventListener("click", () => show("day"));

let toastT = 0;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

$("slots").addEventListener("click", e => {
  const b = e.target.closest("button.pick"); if (!b) return;
  const slot = A.slots.find(s => s.id === b.dataset.slot); if (!slot) return;
  const talk = slot.talks.find(t => t.id === b.dataset.talk);
  const was = pickFor(slot);
  setPick(slot, was && was.id === talk.id ? null : talk);
  render();
  const btn = document.querySelector(`button.pick[data-talk="${CSS.escape(talk.id)}"]`); btn && btn.focus({preventScroll:true});
});
$("slots").addEventListener("toggle", e => {
  const d = e.target; if (!d.matches || !d.matches("details[data-talk]")) return;
  d.open ? openDetails.add(d.dataset.talk) : openDetails.delete(d.dataset.talk);
}, true);
$("day").addEventListener("click", e => {
  const b = e.target.closest("[data-goto]"); if (!b) return;
  show("pick");
  const el = document.getElementById("s-" + b.dataset.goto);
  el && el.scrollIntoView({behavior:"smooth", block:"start"});
});
$("notices").addEventListener("click", e => {
  const act = e.target.closest("[data-act]")?.dataset.act; if (!act) return;
  if (act === "import") {
    const idx = talkIndex(); picks = {talks:{}};
    for (const id of incoming) { const h = idx.get(id); if (h) setPick(h.slot, h.talk); }
    savePicks(); toast("Picks loaded"); show("day");
  }
  if (act === "ack") {
    // Re-anchor moved picks to their new slot; drop picks for talks that are gone.
    const idx = talkIndex(), next = {};
    for (const id of Object.keys(picks.talks)) { const h = idx.get(id); if (h && !next[h.slot.id]) next[h.slot.id] = id; }
    picks = {talks:{}}; for (const [sid, id] of Object.entries(next)) picks.talks[id] = sid; savePicks();
  }
  if (act === "import" || act === "dismiss") { incoming = null; history.replaceState(null, "", location.pathname + location.search); }
  render();
});
$("clearBtn").addEventListener("click", () => {
  if (!Object.keys(picks.talks).length) return;
  const before = picks; picks = {talks:{}}; savePicks(); render();
  const t = $("toast"); t.innerHTML = `Picks cleared · <button class="linkbtn" type="button" id="undo" style="color:inherit">Undo</button>`; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000);
  $("undo").addEventListener("click", () => { picks = before; savePicks(); render(); t.hidden = true; });
});
$("shareBtn").addEventListener("click", async () => {
  const ids = A.slots.map(pickFor).filter(Boolean).map(t => t.id);
  if (!ids.length) { toast("Pick some talks first"); return; }
  const url = `${location.origin}${location.pathname}#picks=${ids.map(encodeURIComponent).join(",")}`;
  try {
    if (navigator.share) { await navigator.share({title:"My TechMids Conf picks", url}); return; }
  } catch(e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch(e) { prompt("Copy this link", url); }
});

// A shared link carries #picks=id,id,...
let incoming = null;
function readHash(){
  const m = location.hash.match(/^#picks=(.*)$/);
  if (!m) return;
  const ids = m[1].split(",").map(decodeURIComponent).filter(Boolean);
  if (ids.length) incoming = ids;
}

// ---------- Load ----------
function useAgenda(data, from){
  if (!data || !Array.isArray(data.slots)) return false;
  A = data;
  $("eyebrow").textContent = `${A.event.title} · Birmingham`;
  const d = new Date(A.event.date + "T12:00:00Z").toLocaleDateString("en-GB", {weekday:"short", day:"numeric", month:"short", year:"numeric", timeZone:"Europe/London"});
  $("meta").innerHTML = `${esc(d)} · ${esc(A.event.start)}–${esc(A.event.end)}<br><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(A.event.venue + " " + A.event.address)}" target="_blank" rel="noopener">${esc(A.event.venue)}, ${esc(A.event.address)}</a>`;
  $("updated").textContent = A.generated ? ` · updated ${new Date(A.generated).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/London"})}` : "";
  render();
  return true;
}
async function load(){
  readHash();
  // Reopening the page lands on "My day" once every slot has a pick; otherwise on "Pick talks".
  // A tab the person chose earlier in this browser session wins (e.g. on reload).
  let saved = null;
  try { saved = sessionStorage.getItem("tmconf:view"); } catch(e) {}
  if (saved) show(saved);
  const cached = store.get(KEY_AGENDA);
  const pickDefault = () => { if (!saved && A && !incoming && isComplete()) show("day"); };
  if (cached) { useAgenda(cached, "cache"); pickDefault(); }
  try {
    const r = await fetch("agenda.json", {cache:"no-cache"});
    if (!r.ok) throw new Error(r.status);
    const fresh = await r.json();
    if (!cached || fresh.version !== cached.version) {
      store.set(KEY_AGENDA, fresh); useAgenda(fresh, "network");
      if (!cached) pickDefault(); else if (!saved && view === "day" && !isComplete()) show("pick");
    }
  } catch(e) {
    if (!A) $("slots").innerHTML = `<div class="notice warn">Couldn't load the agenda. Check your connection and reload. Once it has loaded once, this page works offline.</div>`;
  }
}
load();
window.addEventListener("hashchange", () => { readHash(); render(); });
setInterval(render, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
window.addEventListener("storage", e => { if (e.key === KEY_PICKS) { picks = store.get(KEY_PICKS) || {talks:{}}; render(); } });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
